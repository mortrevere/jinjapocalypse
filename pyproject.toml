[project]
name = "jinjapocalypse"
version = "0.1.0"
description = "A small Jinja-powered static site renderer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2==3.1.3",
    "loguru==0.7.2",
    "markupsafe==2.1.4",
    "pillow==12.0.0",
    "pyyaml==6.0.2",
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
